name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: acc_platform_ci
          POSTGRES_USER: acc_ci
          POSTGRES_PASSWORD: acc_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acc_ci -d acc_platform_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ci-only-secret-key-not-used-anywhere-real
      FIELD_ENCRYPTION_KEY: MTKLRXP2lzk3USEHnrBlXhA94NxWIrKTTym8vdIMX2c=
      DB_NAME: acc_platform_ci
      DB_USER: acc_ci
      DB_PASSWORD: acc_ci_password
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test
