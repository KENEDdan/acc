<div class="form-field {% if wide %}full{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-mark">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<div class="help-text">{{ field.help_text }}</div>{% endif %}
    {% if field.errors %}<div class="field-error">{{ field.errors|striptags }}</div>{% endif %}
</div>
