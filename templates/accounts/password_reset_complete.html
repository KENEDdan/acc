{% extends "base.html" %}
{% block title %}Password Updated{% endblock %}
{% block content %}
<div style="max-width:420px; margin: 40px auto; background:var(--acc-card-bg); border:1px solid var(--acc-border); border-radius:12px; padding:28px;">
    <h2 style="margin-top:0;">Password Updated</h2>
    <p style="color:var(--acc-muted); font-size:.9rem;">
        Your password has been changed. You can now log in with your new password.
    </p>
    <a class="btn-primary" href="{% url 'core:portal' %}">Log In</a>
</div>
{% endblock %}
