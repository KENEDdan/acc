{% extends "base.html" %}
{% block title %}GYM Schools{% endblock %}
{% block content %}
<h1>Schools</h1>
<div class="feed-grid">
    {% for school in schools %}
    <a class="feed-card" href="{% url 'gym:school_detail' school.pk %}">
        <div class="no-image"></div>
        <div class="feed-card-body">
            <h3>{{ school.name }}</h3>
            <p>{{ school.location }}</p>
        </div>
    </a>
    {% empty %}
    <p>No schools added yet.</p>
    {% endfor %}
</div>
{% endblock %}
