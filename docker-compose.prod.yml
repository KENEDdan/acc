# Production stack. Local dev keeps using docker-compose.yml (hardcoded dev
# creds, non-standard ports) — this file reads real secrets from .env instead.
#
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# Postgres is a managed provider (DigitalOcean/RDS/Render/Supabase/etc), not a
# service here — point DB_HOST/DB_PORT/DB_SSLMODE in .env at it, and rely on
# the provider's own automated backups rather than scripts/backup_db.sh (that
# script is still there for an occasional manual/ad-hoc snapshot, just not the
# primary backup strategy anymore).
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - acc_redisdata:/data

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      - redis
    ports:
      - "8000:8000"
    volumes:
      - acc_media:/app/media

  celery_worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: celery -A config worker --loglevel=info
    depends_on:
      - redis
    volumes:
      - acc_media:/app/media

  celery_beat:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - redis

volumes:
  acc_redisdata:
  acc_media:
