# Production stack — single droplet, everything in Docker. Local dev keeps
# using docker-compose.yml (hardcoded dev creds, non-standard ports) — this
# file reads real secrets from .env instead.
#
# Usage: docker compose -f docker-compose.prod.yml up -d --build
#
# Postgres and Redis run as containers on this same droplet (see `db`/`redis`
# below) rather than a managed provider — set DB_HOST=db in .env. If you later
# move to a managed Postgres provider instead, delete the `db` service below,
# drop `db` from `web`/`celery_worker`/`celery_beat`'s depends_on, and point
# DB_HOST/DB_PORT/DB_SSLMODE in .env at the provider (see .env.example).
#
# `nginx` terminates TLS using a Cloudflare Origin Certificate (see
# nginx/README.md) and reverse-proxies everything, including static/media
# URLs, to `web` — whitenoise (already in INSTALLED_APPS) serves those
# straight out of gunicorn, so nginx doesn't need its own copy of either.
# `web` itself is not exposed to the host, only reachable through nginx.
services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - acc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - acc_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - acc_media:/app/media

  celery_worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: celery -A config worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - acc_media:/app/media

  celery_beat:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      # Restricts the image's startup envsubst to just $DOMAIN in the template
      # below — without this it would also try (and fail) to substitute
      # nginx's own $host/$remote_addr/etc. variables.
      NGINX_ENVSUBST_FILTER: DOMAIN
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    # The base image ships its own default.conf (a "Welcome to nginx" site on
    # port 80) alongside whatever our template renders — drop it so a direct
    # IP request (bypassing Cloudflare/the real domain) doesn't serve it.
    command: sh -c "rm -f /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'"

volumes:
  acc_pgdata:
  acc_redisdata:
  acc_media:
