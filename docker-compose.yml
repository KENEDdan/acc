services:
  db:
    image: postgres:15-alpine
    container_name: acc_db
    environment:
      POSTGRES_DB: acc_platform
      POSTGRES_USER: acc_admin
      POSTGRES_PASSWORD: changeme
    ports:
      - "5436:5432"
    volumes:
      - acc_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: acc_redis
    ports:
      - "6382:6379"

volumes:
  acc_pgdata: